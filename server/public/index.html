<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>tokiSync 원격 제어</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="wrap">
        <header>
            <h1>📡 tokiSync 원격 제어</h1>
            <div class="status-pills">
                <span id="pill-online" class="pill off">스크립트 오프라인</span>
                <span id="pill-running" class="pill">정지</span>
            </div>
        </header>

        <div class="panel">
            <h2>시리즈 URL 추가</h2>
            <textarea id="urls" placeholder="https://.../comic/12345&#10;https://.../webtoon/67890 (줄바꿈으로 여러 개)"></textarea>
            <div class="row">
                <button id="btn-add" class="primary">+ 큐에 추가</button>
            </div>
        </div>

        <div class="panel">
            <h2>제어 <small class="muted">(단일 모드)</small></h2>
            <div class="row">
                <button id="btn-start" class="blue">▶️ 시작</button>
                <button id="btn-stop">⏸️ 정지</button>
                <button id="btn-clear" class="danger">🗑️ 비우기</button>
            </div>
            <div id="progress" class="progress"></div>
        </div>

        <div class="panel" id="pool-panel">
            <h2>🌐 멀티-IP 작업 풀</h2>
            <div id="pool-bar" class="pool-bar"></div>
            <div id="pool-counts" class="pool-counts muted"></div>
            <div class="row">
                <button id="btn-requeue-failed" class="small">↩️ 실패분 재투입</button>
                <button id="btn-requeue-stuck" class="small">🩹 멈춘 lease 재투입</button>
            </div>
            <h2 style="margin-top:14px">클라이언트</h2>
            <div id="clients" class="clients-list"><div class="empty">대기 중…</div></div>
        </div>

        <div class="panel" id="jobs-panel">
            <h2>작업 투입 (멀티-IP 분배)</h2>

            <div class="dsx-section" style="margin-bottom:12px">
                <label>⚡ 작품 메인 URL 자동 펼침 (전체 회차)</label>
                <input type="text" id="exp-url" placeholder="예: https://sbxh3.com/manhwa/14 또는 /novel/57328" />
                <div class="row" style="margin-top:6px">
                    <button id="btn-expand" class="primary">📤 전체 회차 자동 투입</button>
                </div>
                <div class="muted" style="font-size:12px">온라인 win-c 클라이언트가 작품 페이지에서 회차 목록을 펼쳐 풀에 투입합니다(서버는 Cloudflare로 직접 못 받음). 클라이언트가 1개 이상 온라인이어야 합니다.</div>
            </div>

            <div class="settings-grid">
                <div>
                    <label>작품/시리즈 라벨 (선택)</label>
                    <input type="text" id="job-series" placeholder="예: 나 혼자만 레벨업" />
                </div>
            </div>
            <label class="muted" style="margin-top:8px;display:block">또는 회차 URL 목록 직접 입력 (줄바꿈으로 여러 개 = 각각 1 unit)</label>
            <textarea id="job-urls" placeholder="https://.../12345/1&#10;https://.../12345/2 (줄바꿈으로 여러 개)"></textarea>
            <details style="margin-top:6px">
                <summary>범위 템플릿으로 생성 ({n} 치환)</summary>
                <div class="settings-grid" style="margin-top:8px">
                    <div>
                        <label>URL 템플릿 ({n} = 회차 번호)</label>
                        <input type="text" id="job-tpl" placeholder="https://.../12345/{n}" />
                    </div>
                    <div class="row">
                        <div><label>시작</label><input type="number" id="job-from" min="1" value="1" style="width:90px" /></div>
                        <div><label>끝</label><input type="number" id="job-to" min="1" value="10" style="width:90px" /></div>
                        <button id="btn-tpl-gen" class="small">↧ 목록에 추가</button>
                    </div>
                </div>
            </details>
            <div class="row" style="margin-top:8px">
                <button id="btn-jobs" class="primary">➕ 작업 풀에 투입</button>
            </div>
        </div>

        <div class="panel">
            <h2>대기열 (<span id="q-count">0</span>)</h2>
            <div id="queue" class="queue-list"><div class="empty">로딩 중…</div></div>
        </div>

        <div class="panel" id="captcha-panel" style="display:none">
            <h2>⚠️ 캡차 알림</h2>
            <div id="captcha"></div>
        </div>

        <div class="panel">
            <details>
                <summary>⚙️ 연결 설정</summary>
                <div class="settings-grid">
                    <div>
                        <label>API 서버 주소 (비우면 현재 호스트)</label>
                        <input type="text" id="set-base" placeholder="http://192.168.0.x:8787" />
                    </div>
                    <div>
                        <label>API 토큰</label>
                        <input type="password" id="set-token" placeholder="컨트롤 API 토큰" />
                    </div>
                    <div>
                        <label>폴링 주기 (초)</label>
                        <input type="number" id="set-poll" min="2" max="60" value="3" />
                    </div>
                    <div class="row">
                        <button id="btn-save">저장</button>
                    </div>
                    <div class="muted" id="conn-info"></div>
                </div>
            </details>
        </div>

        <div class="muted" id="footer"></div>
    </div>

    <div id="toast"></div>
    <script src="app.js"></script>
</body>
</html>
